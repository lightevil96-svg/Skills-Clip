name: Validate Skills-Clip
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skill_repo.py
      - run: python -m unittest discover -s tests -v
      - name: Install FFmpeg for synthetic smoke test
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python scripts/smoke_ffmpeg.py
